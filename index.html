<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d5c">
<title>Jeopardy Scorekeeper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Work+Sans:wght@500;600&display=swap">
<style>
  /* Layout: single-column podium. Score on top, Right and Wrong clue columns side by side, wager panel below. */
  :root {
    --bg: #070d5c;
    --panel: #0c1580;
    --line: #2a3bd6;
    --ink: #f2f4ff;
    --muted: #a9b2f5;
    --gold: #ffcf40;
    --gold-ink: #241a00;
    --right-bg: #1a2fc8;
    --right-fg: #ffe07a;
    --wrong-bg: #4a0f2c;
    --wrong-fg: #ffa3ab;
    --neg: #ff7b82;
    --font-display: 'Oswald', 'Arial Narrow', Impact, sans-serif;
    --font-body: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .podium {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px 12px;
    text-align: center;
  }
  .label {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .score {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(52px, 17vw, 76px); line-height: 1.05;
    color: var(--gold); font-variant-numeric: tabular-nums;
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
    overflow-wrap: anywhere;
  }
  .score.neg { color: var(--neg); }
  .stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .rounds { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
  .rounds button {
    background: transparent; border: 0; padding: 10px 8px; font-weight: 600; color: var(--muted);
    min-height: 44px;
  }
  .rounds button[aria-pressed="true"] { background: var(--line); color: var(--ink); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .col h2 {
    margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 600; text-align: center;
  }
  .col.right h2 { color: var(--right-fg); }
  .col.wrong h2 { color: var(--wrong-fg); }
  .tile {
    min-height: 56px; border: 0; border-radius: 4px;
    font-family: var(--font-display); font-weight: 700; font-size: 28px;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
    transition: transform .08s ease;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.28);
  }
  .tile:active { transform: scale(0.96); }
  .tile.right { background: var(--right-bg); color: var(--right-fg); }
  .tile.wrong { background: var(--wrong-bg); color: var(--wrong-fg); }

  .dd-btn {
    width: 100%; min-height: 56px; border: 0; border-radius: 4px;
    background: var(--gold); color: var(--gold-ink);
    font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .dd-btn:active { transform: scale(0.98); }
  .dd-btn.final { background: var(--ink); color: var(--bg); }
  .special { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .special[hidden] { display: none; }

  .wager {
    background: var(--panel); border: 2px solid var(--gold); border-radius: 6px;
    padding: 14px; display: grid; gap: 12px;
  }
  .wager h2 { margin: 0; font-family: var(--font-display); font-size: 22px; color: var(--gold); letter-spacing: 0.04em; text-transform: uppercase; }
  .wager-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .wager input {
    width: 100%; min-width: 0; min-height: 52px; padding: 0 12px;
    background: #050a45; color: var(--ink); border: 2px solid var(--line); border-radius: 4px;
    font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums;
  }
  .small-btn {
    min-height: 52px; padding: 0 14px; background: transparent; border: 2px solid var(--line);
    border-radius: 4px; font-weight: 600; color: var(--ink);
  }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  .hint.error { color: var(--neg); }
  .wager-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wager-cancel { justify-self: start; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px 0; min-height: 40px; }

  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
  .log li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); padding: 6px 2px; border-bottom: 1px solid rgba(42,59,214,.5); }
  .log li b { font-weight: 600; }
  .log .plus b { color: var(--right-fg); }
  .log .minus b { color: var(--wrong-fg); }
  .log-empty { color: var(--muted); font-size: 14px; margin: 0; }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tools button { min-height: 48px; background: transparent; border: 2px solid var(--line); border-radius: 4px; font-weight: 600; }
  .tools button:disabled { opacity: .4; cursor: default; }
  .tools button.confirm { background: var(--wrong-bg); border-color: var(--wrong-fg); color: var(--wrong-fg); }

  @media (prefers-reduced-motion: reduce) { .tile, .dd-btn { transition: none; } .tile:active, .dd-btn:active { transform: none; } }
</style>

</head>
<body>
<main class="app">
  <section class="podium" aria-label="Score">
    <div class="label">Your score</div>
    <div id="score" class="score" aria-live="polite">$0</div>
    <div id="stats" class="stats"></div>
  </section>

  <div class="rounds" role="group" aria-label="Round">
    <button id="r1" type="button" aria-pressed="true">Jeopardy!</button>
    <button id="r2" type="button" aria-pressed="false">Double Jeopardy!</button>
  </div>

  <section class="cols" aria-label="Clue values">
    <div class="col right"><h2>Right</h2><div id="rightCol" class="col" style="gap:8px"></div></div>
    <div class="col wrong"><h2>Wrong</h2><div id="wrongCol" class="col" style="gap:8px"></div></div>
  </section>

  <div id="special" class="special">
    <button id="ddBtn" class="dd-btn" type="button">Daily Double</button>
    <button id="finalBtn" class="dd-btn final" type="button">Final Jeopardy</button>
  </div>

  <section id="wager" class="wager" hidden aria-label="Wager">
    <h2 id="wagerTitle">Daily Double wager</h2>
    <div class="wager-row">
      <input id="wagerInput" type="text" inputmode="numeric" autocomplete="off" placeholder="$0" aria-label="Wager amount">
      <button id="maxBtn" class="small-btn" type="button">Max</button>
    </div>
    <p id="wagerHint" class="hint"></p>
    <div class="wager-actions">
      <button id="wagerRight" class="tile right" type="button">Right</button>
      <button id="wagerWrong" class="tile wrong" type="button">Wrong</button>
    </div>
    <button id="wagerCancel" class="wager-cancel" type="button">Cancel</button>
  </section>

  <section aria-label="Recent clues">
    <div class="label" style="margin-bottom:6px">Recent</div>
    <ul id="log" class="log"></ul>
    <p id="logEmpty" class="log-empty">Tap a value when you get a clue right or wrong.</p>
  </section>

  <div class="tools">
    <button id="undoBtn" type="button">Undo last</button>
    <button id="resetBtn" type="button">New game</button>
  </div>
</main>

<script>
(function () {
  var KEY = 'jeopardy-scorekeeper-v1';
  var VALUES = { 1: [200, 400, 600, 800, 1000], 2: [400, 800, 1200, 1600, 2000] };
  var state = { score: 0, round: 1, log: [] };

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.score === 'number') {
        state.score = p.score;
        state.round = p.round === 2 ? 2 : 1;
        state.log = Array.isArray(p.log) ? p.log : [];
      }
    }
  } catch (e) {}

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function money(n) { var s = '$' + Math.abs(n).toLocaleString('en-US'); return n < 0 ? '−' + s : s; }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
  function $(id) { return document.getElementById(id); }

  var scoreEl = $('score'), statsEl = $('stats'), logEl = $('log'), logEmpty = $('logEmpty');
  var rightCol = $('rightCol'), wrongCol = $('wrongCol');
  var wagerPanel = $('wager'), wagerInput = $('wagerInput'), wagerHint = $('wagerHint');
  var undoBtn = $('undoBtn'), resetBtn = $('resetBtn'), resetTimer = null;

  var mode = 'dd';
  function roundMax() { return VALUES[state.round][4]; }
  function maxWager() { return mode === 'final' ? Math.max(state.score, 0) : Math.max(state.score, roundMax()); }

  function buildTiles() {
    rightCol.innerHTML = ''; wrongCol.innerHTML = '';
    VALUES[state.round].forEach(function (v) {
      var r = document.createElement('button');
      r.type = 'button'; r.className = 'tile right'; r.textContent = '+' + money(v);
      r.setAttribute('aria-label', 'Right, plus ' + v + ' dollars');
      r.addEventListener('click', function () { apply(v, 'Right'); });
      rightCol.appendChild(r);
      var w = document.createElement('button');
      w.type = 'button'; w.className = 'tile wrong'; w.textContent = '−' + money(v);
      w.setAttribute('aria-label', 'Wrong, minus ' + v + ' dollars');
      w.addEventListener('click', function () { apply(-v, 'Wrong'); });
      wrongCol.appendChild(w);
    });
  }

  function render() {
    scoreEl.textContent = money(state.score);
    scoreEl.classList.toggle('neg', state.score < 0);
    var right = 0, wrong = 0;
    state.log.forEach(function (e) { if (e.d > 0) right++; else if (e.d < 0) wrong++; });
    statsEl.textContent = right + ' right · ' + wrong + ' wrong';
    $('r1').setAttribute('aria-pressed', state.round === 1 ? 'true' : 'false');
    $('r2').setAttribute('aria-pressed', state.round === 2 ? 'true' : 'false');
    logEl.innerHTML = '';
    state.log.slice(-5).reverse().forEach(function (e) {
      var li = document.createElement('li');
      li.className = e.d > 0 ? 'plus' : 'minus';
      var a = document.createElement('span'); a.textContent = e.k;
      var b = document.createElement('b'); b.textContent = (e.d > 0 ? '+' : '−') + money(Math.abs(e.d));
      li.appendChild(a); li.appendChild(b); logEl.appendChild(li);
    });
    logEmpty.hidden = state.log.length > 0;
    undoBtn.disabled = state.log.length === 0;
  }

  function apply(delta, kind) {
    state.score += delta;
    state.log.push({ d: delta, k: kind });
    save(); buzz(); render();
  }

  function setRound(n) { state.round = n; save(); buildTiles(); render(); updateHint(); }

  function updateHint() {
    wagerHint.classList.remove('error');
    if (mode === 'final') {
      wagerHint.textContent = state.score > 0
        ? 'Max wager: ' + money(state.score) + ' (your full score). Wager $0 to sit it out.'
        : 'You need a positive score to play Final Jeopardy.';
    } else {
      wagerHint.textContent = 'Max wager: ' + money(maxWager()) + ' (your score or the top clue, whichever is higher)';
    }
  }

  function readWager() {
    var n = parseInt((wagerInput.value || '').replace(/[^0-9]/g, ''), 10);
    return isNaN(n) ? 0 : n;
  }

  function finishWager(sign) {
    var rawVal = (wagerInput.value || '').replace(/[^0-9]/g, '');
    var w = readWager();
    var final = mode === 'final';
    var problem = '';
    if (final && state.score <= 0) problem = 'You need a positive score to play Final Jeopardy.';
    else if (rawVal === '' || (!final && w === 0)) problem = 'Enter a wager first.';
    else if (w > maxWager()) problem = 'Wager can’t exceed ' + money(maxWager()) + '.';
    if (problem) {
      wagerHint.textContent = problem;
      wagerHint.classList.add('error');
      wagerInput.focus();
      return;
    }
    if (w > 0) apply(sign * w, (final ? 'Final Jeopardy' : 'Daily Double') + (sign > 0 ? ' right' : ' wrong'));
    closeWager();
  }

  function openWager(m) {
    mode = m;
    $('wagerTitle').textContent = m === 'final' ? 'Final Jeopardy wager' : 'Daily Double wager';
    wagerInput.value = '';
    updateHint();
    wagerPanel.hidden = false;
    $('special').hidden = true;
    wagerInput.focus();
  }
  function closeWager() { wagerPanel.hidden = true; $('special').hidden = false; }

  $('r1').addEventListener('click', function () { setRound(1); });
  $('r2').addEventListener('click', function () { setRound(2); });
  $('ddBtn').addEventListener('click', function () { openWager('dd'); });
  $('finalBtn').addEventListener('click', function () { openWager('final'); });
  $('wagerCancel').addEventListener('click', closeWager);
  $('maxBtn').addEventListener('click', function () { wagerInput.value = String(maxWager()); updateHint(); });
  $('wagerRight').addEventListener('click', function () { finishWager(1); });
  $('wagerWrong').addEventListener('click', function () { finishWager(-1); });
  wagerInput.addEventListener('input', function () {
    var n = readWager();
    wagerInput.value = n ? '$' + n.toLocaleString('en-US') : '';
    updateHint();
  });

  undoBtn.addEventListener('click', function () {
    var last = state.log.pop();
    if (!last) return;
    state.score -= last.d;
    save(); buzz(); render();
  });

  resetBtn.addEventListener('click', function () {
    if (resetBtn.classList.contains('confirm')) {
      clearTimeout(resetTimer);
      resetBtn.classList.remove('confirm'); resetBtn.textContent = 'New game';
      state = { score: 0, round: 1, log: [] };
      save(); buildTiles(); closeWager(); render();
      return;
    }
    resetBtn.classList.add('confirm'); resetBtn.textContent = 'Tap again to reset';
    resetTimer = setTimeout(function () {
      resetBtn.classList.remove('confirm'); resetBtn.textContent = 'New game';
    }, 3000);
  });

  buildTiles();
  render();
})();
</script>
</body>
</html>
